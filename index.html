<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>乘法公式街機格鬥挑戰</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#050910;color:#fff}
body{min-height:100dvh;display:grid;place-items:center;padding:14px;overflow-x:hidden}
.arena{position:relative;width:min(1200px,100%);min-height:min(720px,94dvh);border:3px solid #283f5c;border-radius:30px;overflow:hidden;
box-shadow:0 22px 60px #000b;background:#07111d}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.48) saturate(1.25);transform:scale(1.08)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,5,12,.12),rgba(4,9,20,.78) 31%,rgba(4,9,20,.84) 50%,rgba(4,9,20,.78) 69%,rgba(2,5,12,.12))}
.fighter{position:absolute;bottom:0;height:76%;max-width:37%;object-fit:contain;z-index:2;filter:drop-shadow(0 15px 12px #000b)}
.p1{left:-1%}
.p2{right:-1%;transform:scaleX(-1)}
.center{position:relative;z-index:5;width:min(510px,48%);margin:22px auto;padding:22px 22px 24px;background:rgba(5,13,29,.91);
border:2px solid #485fca;border-radius:22px;box-shadow:0 12px 35px #000a;text-align:center}
.kicker{font-size:20px;color:#ffbd2f;font-weight:900;letter-spacing:2px}
h1{margin:4px 0 3px;font-size:clamp(34px,5vw,58px);line-height:1.03;color:#fff0a0;text-shadow:3px 3px 0 #b3261e,6px 6px 0 #29123e}
.sub{color:#c8d8ef;margin:8px 0 20px}
.label{font-weight:900;color:#fff;text-align:left;margin:13px 0 8px}
.mode{display:block;text-decoration:none;color:white;border:2px solid #506b9d;border-radius:13px;margin:10px 0;padding:14px 16px;text-align:left;
background:linear-gradient(90deg,#13243b,#0d1728);font-size:20px;font-weight:900;transition:.15s}
.mode:hover{transform:translateY(-2px);border-color:#ffe14a;box-shadow:0 0 22px #ffd83d44}
.mode b{float:right;color:#9cc7ff;font-size:15px;padding-top:3px}
.online{border-color:#765ce9;background:linear-gradient(90deg,#24205a,#141735)}
.online b{color:#d7c8ff}
.rules{margin-top:18px;border:1px solid #42527c;border-radius:13px;padding:13px 15px;text-align:left;background:#0a1428cc;color:#dce6f5;font-size:14px;line-height:1.65}
.sideword{position:absolute;z-index:4;top:13%;font-size:clamp(24px,3vw,42px);font-weight:1000;color:#fff;text-shadow:3px 3px 0 #b61d45,0 0 12px #6d2cff;transform:rotate(-8deg)}
.sw1{left:10%} .sw2{right:9%;transform:rotate(8deg);text-shadow:3px 3px 0 #006bd6,0 0 12px #25b7ff}
@media(max-width:800px){
 body{padding:6px} .arena{min-height:100dvh;border-radius:14px}
 .center{width:66%;padding:14px;margin:10px auto}
 .fighter{height:56%;opacity:.72} .p1{left:-10%} .p2{right:-10%}
 .sideword{display:none} h1{font-size:clamp(28px,6vw,42px)} .mode{font-size:17px;padding:12px}
}
</style></head>
